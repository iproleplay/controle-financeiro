<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prioridades</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    background-color: #0e0e11;
    color: #f1f1f1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.card-premium {
    background: linear-gradient(145deg, #17171c, #111114);
    border: 1px solid #23232a;
    border-radius: 18px;
    padding: 22px;
}

.btn-gold {
    background: linear-gradient(90deg, #d4af37, #f4d03f);
    border: none;
    color: black;
    font-weight: 600;
    border-radius: 10px;
}

.btn-gold:hover {
    opacity: 0.9;
}

.form-control {
    background-color: #141418;
    border: 1px solid #2a2a33;
    color: #f1f1f1;
    border-radius: 10px;
}

canvas {
    max-height: 320px;
}
</style>
</head>

<body>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5>Contas Prioritárias</h5>
        <div>
            <a href="/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
        </div>
    </div>

    <div class="row">

        <div class="col-md-4">
            <div class="card-premium">
                <h6 class="mb-3">Nova Prioridade</h6>

                <form method="POST">
                    <input type="text" name="nome" class="form-control mb-2" placeholder="Nome da conta" required>
                    <input type="number" step="0.01" name="valor" class="form-control mb-2" placeholder="Valor" required>
                    <button class="btn btn-gold w-100">Adicionar</button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card-premium">
                <h6 class="mb-3">Impacto das Prioridades</h6>

                <canvas id="graficoPrioridades"></canvas>

                <div class="mt-3 text-warning">
                    Total Prioridades: <strong>{{ total_prioridades | brl }}</strong>
                </div>

                <ul class="list-group list-group-flush mt-3">
                    {% for p in prioridades %}
                    <li class="list-group-item bg-transparent text-light d-flex justify-content-between border-secondary">
                        {{ p[1] }}
                        <span>{{ p[2] | brl }}</span>
                    </li>
                    {% endfor %}
                </ul>

            </div>
        </div>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    const dados = {{ prioridades | tojson }};
    if (!dados || dados.length === 0) return;

    const nomes = dados.map(item => item[1]);
    const valores = dados.map(item => item[2]);

    const ctx = document.getElementById("graficoPrioridades").getContext("2d");

    const gradient = ctx.createLinearGradient(0, 0, 600, 0);
    gradient.addColorStop(0, "#d4af37");
    gradient.addColorStop(1, "#f4d03f");

    new Chart(ctx, {
        type: "bar",
        data: {
            labels: nomes,
            datasets: [{
                data: valores,
                backgroundColor: gradient,
                borderRadius: 14,
                borderSkipped: false,
                barThickness: 28
            }]
        },
        options: {
            indexAxis: 'y',
            plugins: {
                legend: { display: false },
                tooltip: { enabled: false }  // 🔥 Tooltip removido
            },
            scales: {
                x: {
                    ticks: { color: "#aaa" },
                    grid: { color: "#2a2a33" }
                },
                y: {
                    ticks: { color: "#ccc" },
                    grid: { display: false }
                }
            },
            animation: {
                duration: 1200,
                easing: "easeOutQuart"
            }
        }
    });

});
</script>

</body>
</html>
