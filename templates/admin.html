<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gerenciar Usuários</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="sidebar">
    <h2>👑 Admin Panel</h2>
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/admin">Gerenciar Usuários</a>
    <a href="/dashboard">Voltar para Painel Usuário</a>
</div>

<div class="main">

    <div class="navbar">
        <h1>Gerenciar Usuários</h1>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>

    <div class="content">

        {% for u in usuarios %}
        <div class="card">

            <form method="POST" action="/admin/editar/{{ u.id }}">

                <h3>ID {{ u.id }}</h3>

                <label>Nome</label>
                <input type="text" name="nome" value="{{ u.nome }}">

                <label>Email</label>
                <input type="email" name="email" value="{{ u.email }}">

                <label>Nova Senha (opcional)</label>
                <input type="password" name="senha" placeholder="Deixe vazio para manter">

                <label>Permissão</label>
                <select name="role">
                    <option value="user" {% if u.role == 'user' %}selected{% endif %}>Usuário</option>
                    <option value="admin" {% if u.role == 'admin' %}selected{% endif %}>Admin</option>
                </select>

                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button type="submit">Salvar Alterações</button>

                    {% if u.id != session["usuario_id"] %}
                    <a href="/admin/excluir/{{ u.id }}"
                       style="background:#ef4444; padding:12px; border-radius:8px; text-align:center; text-decoration:none; color:white;">
                       Excluir
                    </a>
                    {% endif %}
                </div>

            </form>

        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
