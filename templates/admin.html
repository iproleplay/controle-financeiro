<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:30px;}
h2{text-align:center;margin-bottom:30px;}
table{width:100%;border-collapse:collapse;background:#1e293b;}
th,td{padding:12px;border-bottom:1px solid #334155;text-align:left;}
input,select{padding:5px;}
button{background:#3b82f6;color:white;border:none;padding:6px 10px;cursor:pointer;}
a{color:red;text-decoration:none;margin-left:10px;}
</style>
</head>
<body>

<h2>Painel Administrativo</h2>

<table>
<tr>
<th>ID</th>
<th>Nome</th>
<th>Email</th>
<th>Role</th>
<th>Ações</th>
</tr>

{% for u in usuarios %}
<tr>
<form method="POST" action="/admin/editar/{{u.id}}">
<td>{{u.id}}</td>
<td><input name="nome" value="{{u.nome}}"></td>
<td><input name="email" value="{{u.email}}"></td>
<td>
<select name="role">
<option value="user" {% if u.role == 'user' %}selected{% endif %}>User</option>
<option value="admin" {% if u.role == 'admin' %}selected{% endif %}>Admin</option>
</select>
</td>
<td>
<input type="password" name="senha" placeholder="Nova senha">
<button>Salvar</button>
<a href="/admin/excluir/{{u.id}}">Excluir</a>
</td>
</form>
</tr>
{% endfor %}

</table>

</body>
</html>
