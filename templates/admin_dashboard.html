<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard Admin</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="sidebar">
    <h2>👑 Admin Panel</h2>

    <a href="{{ url_for('admin') }}">Gerenciar Usuários</a>
    <a href="{{ url_for('dashboard') }}">Painel do Usuário</a>
</div>

<div class="main">

    <div class="navbar">
        <h1>Dashboard Administrativo</h1>
        <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
    </div>

    <div class="content">

        <!-- CARDS RESUMO -->
        <div class="grid">

            <div class="card">
                <h3>Total Usuários</h3>
                <div class="stat">{{ total_usuarios }}</div>
            </div>

            <div class="card">
                <h3>Total Admins</h3>
                <div class="stat">{{ total_admins }}</div>
            </div>

            <div class="card">
                <h3>Total Lançamentos</h3>
                <div class="stat">{{ total_lancamentos }}</div>
            </div>

            <div class="card">
                <h3>Total Movimentado</h3>
                <div class="stat">{{ total_movimentado | brl }}</div>
            </div>

        </div>

        <!-- GRÁFICO -->
        <div class="card">
            <h3>Distribuição Geral por Categoria</h3>
            <canvas id="graficoAdmin"></canvas>
        </div>

    </div>

</div>

<script>
const resumo = {{ resumo_categoria | default([]) | tojson | safe }};

if (Array.isArray(resumo) && resumo.length > 0) {
    new Chart(document.getElementById("graficoAdmin"), {
        type: "doughnut",
        data: {
            labels: resumo.map(i => i[0]),
            datasets: [{
                data: resumo.map(i => i[1]),
                backgroundColor: [
                    "#ef4444",
                    "#3b82f6",
                    "#facc15",
                    "#22c55e",
                    "#a855f7",
                    "#f97316"
                ]
            }]
        }
    });
}
</script>

</body>
</html>
