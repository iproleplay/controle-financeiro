<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard Admin</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
h1{
    margin-bottom:30px;
    font-weight:600;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card h3{
    opacity:0.7;
    margin-bottom:10px;
}

.stat{
    font-size:22px;
    font-weight:600;
}

canvas{
    max-height:320px;
}
</style>

</head>
<body>

<h1>👑 Dashboard Administrativo</h1>

<div class="grid">

<div class="card">
<h3>Total de Usuários</h3>
<div class="stat">{{ total_usuarios }}</div>
</div>

<div class="card">
<h3>Total de Admins</h3>
<div class="stat">{{ total_admins }}</div>
</div>

<div class="card">
<h3>Total de Lançamentos</h3>
<div class="stat">{{ total_lancamentos }}</div>
</div>

<div class="card">
<h3>Total Movimentado</h3>
<div class="stat">{{ total_movimentado | brl }}</div>
</div>

</div>

<div class="card">
<h3>📊 Distribuição Geral por Categoria</h3>
<canvas id="graficoAdmin"></canvas>
</div>

<script>
const resumo = {{ resumo_categoria | tojson | safe }};

if(resumo && resumo.length > 0){
    new Chart(document.getElementById("graficoAdmin"),{
        type:"doughnut",
        data:{
            labels:resumo.map(i=>i[0]),
            datasets:[{
                data:resumo.map(i=>i[1]),
                backgroundColor:["#ef4444","#3b82f6","#facc15","#22c55e","#a855f7","#f97316"]
            }]
        }
    });
}
</script>

</body>
</html>
