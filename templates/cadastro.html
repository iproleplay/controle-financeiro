<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Criar Conta</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Inter, Arial, sans-serif;
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:#1e293b;
    padding:40px;
    border-radius:18px;
    width:350px;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    border:1px solid rgba(255,255,255,0.05);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background:#334155;
    color:white;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:#3b82f6;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#2563eb;
    transform:translateY(-2px);
}

.link{
    text-align:center;
    margin-top:15px;
    font-size:13px;
}

.link a{
    color:#3b82f6;
    text-decoration:none;
}

.link a:hover{
    text-decoration:underline;
}
</style>
</head>
<body>

<div class="card">
<h2>🚀 Criar Conta</h2>

<form method="POST">
<input type="text" name="nome" placeholder="Nome completo" required>
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="senha" placeholder="Senha" required>
<button type="submit">Cadastrar</button>
</form>

<div class="link">
Já tem conta? <a href="/">Fazer login</a>
</div>
</div>

</body>
</html>
