<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    background: linear-gradient(145deg, #0e0e11, #141418);
    color: #f1f1f1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.card-premium {
    background: linear-gradient(145deg, #17171c, #111114);
    border: 1px solid #23232a;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
}

.valor {
    font-size: 1.6rem;
    font-weight: 600;
}

.btn-gold {
    background: linear-gradient(90deg, #d4af37, #f4d03f);
    border: none;
    color: black;
    font-weight: 600;
    border-radius: 10px;
}

.form-control, .form-select {
    background-color: #141418;
    border: 1px solid #2a2a33;
    color: #f1f1f1;
    border-radius: 10px;
}

.progress {
    background-color: #1b1b22;
}
</style>
</head>

<body>

<div class="container py-4">

<!-- HEADER -->
<div class="card-premium mb-4">
    <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Olá, {{ nome }}</h5>
        <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
    </div>
</div>

<!-- CARDS -->
<div class="row mb-4">

    <div class="col-md-4">
        <div class="card-premium text-center">
            <small>Saldo Atual</small>
            <div class="valor text-success">{{ saldo | brl }}</div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card-premium text-center">
            <small>Meta</small>
            <div class="valor text-warning">{{ meta | brl }}</div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card-premium text-center">
            <small>Progresso</small>
            <div class="valor text-info">{{ progresso|round(1) }}%</div>
            <div class="progress mt-2" style="height:8px;">
                <div class="progress-bar bg-warning"
                     style="width: {{ progresso }}%;">
                </div>
            </div>
        </div>
    </div>

</div>

<!-- FORMULÁRIOS -->
<div class="row">

    <!-- GASTO -->
    <div class="col-md-4">
        <div class="card-premium">
            <h6>Adicionar Gasto</h6>
            <form method="POST">
                <input type="hidden" name="tipo" value="gasto">
                <input type="text" name="descricao" class="form-control mb-2" placeholder="Descrição" required>
                <input type="number" step="0.01" name="valor" class="form-control mb-2" placeholder="Valor" required>
                <select name="categoria" class="form-select mb-2">
                    <option>Alimentação</option>
                    <option>Transporte</option>
                    <option>Lazer</option>
                    <option>Fixo</option>
                    <option>Outros</option>
                </select>
                <button class="btn btn-gold w-100">Salvar</button>
            </form>
        </div>
    </div>

    <!-- PRIORIDADE -->
    <div class="col-md-4">
        <div class="card-premium">
            <h6>Conta Prioritária</h6>
            <form method="POST">
                <input type="hidden" name="tipo" value="prioridade">
                <input type="text" name="nome" class="form-control mb-2" placeholder="Nome da conta" required>
                <input type="number" step="0.01" name="valor" class="form-control mb-2" placeholder="Valor" required>
                <button class="btn btn-gold w-100">Adicionar</button>
            </form>
        </div>
    </div>

    <!-- META -->
    <div class="col-md-4">
        <div class="card-premium">
            <h6>Definir Meta</h6>
            <form method="POST">
                <input type="hidden" name="tipo" value="meta">
                <input type="number" step="0.01" name="meta" class="form-control mb-2" placeholder="Valor da meta" required>
                <button class="btn btn-gold w-100">Atualizar</button>
            </form>
        </div>
    </div>

</div>

<!-- GRÁFICO -->
<div class="card-premium mt-4 text-center">
    <h6>Distribuição de Gastos</h6>
    <canvas id="graficoCategoria"></canvas>
</div>

</div>

<script>
const dados = {{ resumo_categoria | tojson }};

if (dados.length > 0) {
    new Chart(document.getElementById("graficoCategoria"), {
        type: "doughnut",
        data: {
            labels: dados.map(item => item[0]),
            datasets: [{
                data: dados.map(item => item[1]),
                backgroundColor: ["#2ecc71","#3498db","#9b59b6","#e74c3c","#f39c12"],
                borderWidth: 0
            }]
        },
        options: {
            plugins: {
                legend: { labels: { color: "#ccc" } },
                tooltip: { enabled: false }
            }
        }
    });
}
</script>

</body>
</html>
