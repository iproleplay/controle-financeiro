<script>
const resumoCategoria = {{ resumo_categoria|default([])|tojson }};
const resumoTipo = {{ resumo_tipo|default([])|tojson }};
const evolucaoMensal = {{ evolucao_mensal|default([])|tojson }};

// ===== CATEGORIA =====
if (resumoCategoria.length) {
    new Chart(document.getElementById("graficoCategoria"), {
        type: "doughnut",
        data: {
            labels: resumoCategoria.map(i => i[0]),
            datasets: [{
                data: resumoCategoria.map(i => i[1]),
                backgroundColor: ["#ef4444","#3b82f6","#facc15","#22c55e","#a855f7","#f97316"]
            }]
        }
    });
}

// ===== TIPO =====
if (resumoTipo.length) {
    new Chart(document.getElementById("graficoTipo"), {
        type: "pie",
        data: {
            labels: resumoTipo.map(i => i[0]),
            datasets: [{
                data: resumoTipo.map(i => i[1]),
                backgroundColor: ["#3b82f6","#ef4444"]
            }]
        }
    });
}

// ===== EVOLUÇÃO =====
if (evolucaoMensal.length) {
    new Chart(document.getElementById("graficoMensal"), {
        type: "line",
        data: {
            labels: evolucaoMensal.map(i => i[0]),
            datasets: [{
                label: "Total por Mês",
                data: evolucaoMensal.map(i => i[1]),
                borderColor: "#22c55e",
                tension: 0.4,
                fill: false
            }]
        }
    });
}
</script>
